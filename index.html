<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收支记录</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#111827" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>收支记录</h1>
      <p class="subtitle">Kalkulator uang masuk dan keluar</p>

      <label>姓名 / Nama</label>
      <input id="name" type="text" placeholder="Contoh: 张三" />

      <label>收入 / Uang Masuk</label>
      <input id="income" type="number" inputmode="decimal" placeholder="0" />

      <label>支出 / Uang Keluar</label>
      <input id="expense" type="number" inputmode="decimal" placeholder="0" />

      <button id="saveBtn">保存 / Simpan</button>
    </section>

    <section class="summary">
      <div>
        <span>总收入</span>
        <strong id="totalIncome">0</strong>
      </div>
      <div>
        <span>总支出</span>
        <strong id="totalExpense">0</strong>
      </div>
      <div class="balance">
        <span>余额 / Saldo</span>
        <strong id="balance">0</strong>
      </div>
    </section>

    <section class="card">
      <div class="row-title">
        <h2>记录</h2>
        <button class="small" id="clearBtn">清空</button>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
