<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>收支核对</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="收支核对" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="appTitle" contenteditable="true" spellcheck="false">收支核对</h1>
        <p>四列同屏 · 手机竖屏表格</p>
      </div>
      <div id="globalStatus" class="status-chip ok">
        <strong id="globalStatusText">成功</strong>
        <span id="globalStatusSub">已平衡</span>
      </div>
    </header>

    <section class="quickbar">
      <button id="addRowBtn" class="btn primary">＋行</button>
      <button id="saveImageBtn" class="btn dark">存图</button>
      <button id="modeBtn" class="btn soft">纵向</button>
      <button id="compactBtn" class="btn soft">紧凑</button>
    </section>

    <details class="settings">
      <summary>设置 / 备份</summary>
      <div class="settings-grid">
        <label class="scale-control">
          <span>显示大小</span>
          <input id="fontScale" type="range" min="82" max="116" value="100" />
        </label>
        <button id="backupBtn" class="btn soft">导出备份</button>
        <label class="btn soft import-btn">
          导入备份
          <input id="importBackupInput" type="file" accept="application/json" hidden />
        </label>
        <div class="save-state">
          <span>自动保存</span>
          <strong id="saveState">已保存</strong>
        </div>
      </div>
    </details>

    <section id="tableMode" class="table-card">
      <div class="group-head">
        <div class="income-title">收入</div>
        <div class="expense-title">支出</div>
      </div>

      <div class="grid-head">
        <div id="incomeNameLabel" contenteditable="true" spellcheck="false">姓名</div>
        <div id="incomeMoneyLabel" contenteditable="true" spellcheck="false">金额</div>
        <div id="expenseNameLabel" contenteditable="true" spellcheck="false">姓名</div>
        <div id="expenseMoneyLabel" contenteditable="true" spellcheck="false">金额</div>
      </div>

      <div id="tableRows" class="table-rows"></div>

      <footer class="totals">
        <div>
          <span>收入</span>
          <strong id="totalIncome">0</strong>
        </div>
        <div>
          <span>支出</span>
          <strong id="totalExpense">0</strong>
        </div>
        <div id="diffBox">
          <span>差额</span>
          <strong id="difference">0</strong>
        </div>
      </footer>
    </section>

    <section id="verticalMode" class="vertical-card">
      <div class="vertical-title">
        <strong>纵向输入</strong>
        <span>适合手机快速录入</span>
      </div>
      <div id="verticalRows" class="vertical-rows"></div>
    </section>

    <section class="note">
      数据保存到 IndexedDB 与 localStorage。刷新或关闭浏览器不会丢失；清除网站数据、更换域名或无痕模式可能丢失。金额栏支持：100+20、500-75、12*3、1000/4、100×3、1000÷4。
    </section>
  </main>

  <dialog id="imageDialog">
    <div class="dialog-card">
      <header>
        <h3>凭证图片</h3>
        <button id="closeImageDialog" class="icon-only">×</button>
      </header>
      <img id="previewImage" alt="凭证图片" />
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
